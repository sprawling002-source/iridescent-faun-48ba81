<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Choose Your Bundle - Sugar & Sage</title>
<style>
  body { font-family: 'Segoe UI', sans-serif; background: #fdf6f0; margin: 0; padding: 20px; }
  .container { max-width: 500px; margin: 0 auto; background: white; border-radius: 16px; padding: 24px; box-shadow: 0 4px 20px rgba(0,0,0,0.06); }
  h1 { text-align: center; color: #3a2a22; margin: 0 0 8px; font-size: 22px; }
  .sub { text-align: center; color: #8a6b5e; font-size: 13px; margin-bottom: 20px; }
  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .scent { border: 2px solid #f0e0d6; border-radius: 12px; padding: 12px; cursor: pointer; transition: all 0.2s; position: relative; }
  .scent.selected { border-color: #3a2a22; background: #fdf6f0; }
  .scent .num { font-weight: bold; font-size: 12px; color: #c97a6b; }
  .scent .name { font-size: 12px; font-weight: 600; color: #3a2a22; margin: 4px 0; line-height: 1.2; }
  .check { position: absolute; top: 8px; right: 8px; width: 20px; height: 20px; border-radius: 50%; border: 2px solid #ddd; display: flex; align-items: center; justify-content: center; font-size: 12px; }
  .scent.selected .check { background: #3a2a22; color: white; border-color: #3a2a22; }
  .counter { text-align: center; margin: 16px 0; font-weight: 600; color: #3a2a22; }
  .btn { width: 100%; background: #3a2a22; color: white; border: none; padding: 16px; border-radius: 10px; font-size: 14px; font-weight: bold; cursor: pointer; margin-top: 10px; }
  .btn:disabled { background: #ccc; cursor: not-allowed; }
  .note { font-size: 11px; color: #8a6b5e; text-align: center; margin-top: 12px; }
</style>
</head>
<body>
<div class="container">
  <h1>Sugar & Sage</h1>
  <div class="sub">CHOOSE ANY 2 FOR R300</div>
  <div class="counter" id="counter">Select 2 scents</div>
  <div class="grid" id="grid"></div>
  <button class="btn" id="payBtn" disabled>Select 2 scents to continue</button>
  <div class="note">You will be taken to secure Yoco checkout for R300<br>Your 2 scents will be included automatically</div>
</div>
<script>
const scents = [
  {id:'001', name:'Vanilla Cloud & Pink Musk'},
  {id:'002', name:'Warm Amber & Sandalwood'},
  {id:'003', name:'Summer Citrus Bloom'},
  {id:'004', name:'Lavender Sage'},
  {id:'005', name:'Ocean Breeze'},
  {id:'006', name:'Berry Bloom'},
];
const grid = document.getElementById('grid');
const counter = document.getElementById('counter');
const payBtn = document.getElementById('payBtn');
let selected = [];

scents.forEach(s => {
  const div = document.createElement('div');
  div.className='scent';
  div.innerHTML=`<div class="check">✓</div><div class="num">#${s.id}</div><div class="name">${s.name}</div>`;
  div.onclick=()=>{
    const idx=selected.indexOf(s.id);
    if(idx>-1){ selected.splice(idx,1); div.classList.remove('selected'); }
    else { if(selected.length<2){ selected.push(s.id); div.classList.add('selected'); } }
    update();
  };
  grid.appendChild(div);
});

function update(){
  counter.textContent = selected.length===0 ? 'Select 2 scents' : selected.length===1 ? `1 of 2 selected: #${selected[0]}` : `2 selected: #${selected.join(' + #')}`;
  if(selected.length===2){
    payBtn.disabled=false;
    payBtn.textContent=`Pay R300 for #${selected[0]} + #${selected[1]}`;
  } else {
    payBtn.disabled=true;
    payBtn.textContent=selected.length===0 ? 'Select 2 scents to continue' : 'Select 1 more scent';
  }
}
payBtn.onclick=()=>{
  const yocoBase='https://pay.yoco.com/r/ePKogv';
  // Yoco supports adding description via URL - we add reference
  const ref = `SUGAR_SAGE_${selected.join('_')}`;
  const url = `${yocoBase}?reference=${ref}&description=${encodeURIComponent('Bundle: #'+selected.join(' + #'))}`;
  // Also copy to clipboard for notes
  navigator.clipboard.writeText(`Bundle: #${selected[0]} + #${selected[1]}`).catch(()=>{});
  window.open(url, '_blank');
};
</script>
</body>
</html>
