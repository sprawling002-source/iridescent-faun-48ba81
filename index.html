<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sugar & Sage | Handcrafted in Cape Town</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Playfair+Display:wght@600&display=swap" rel="stylesheet">
<style>
:root{--pink:#F7C6D0;--pink-dark:#E89BAD;--pink-light:#FDEBF1;--cream:#FFF9FA;--charcoal:#2D3436;--gold:#D4A574;--white:#fff}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Inter,system-ui;background:var(--cream);color:var(--charcoal);line-height:1.6}
header{background:var(--white);border-bottom:1px solid #f0e6e9;position:sticky;top:0;z-index:20}
.nav{max-width:1200px;margin:0 auto;padding:16px 24px;display:flex;justify-content:space-between;align-items:center}
.logo{font-family:"Playfair Display",serif;font-size:26px}.logo span{color:var(--pink-dark)}
.badge{background:var(--pink);padding:4px 10px;border-radius:20px;font-size:11px;margin-left:8px;font-weight:600}
.cart{position:relative;cursor:pointer;font-size:22px}
.cart-count{position:absolute;top:-8px;right:-10px;background:var(--pink-dark);color:white;border-radius:50%;width:22px;height:22px;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700}
.hero{max-width:1200px;margin:40px auto;padding:0 24px;text-align:center}
.hero h1{font-family:"Playfair Display",serif;font-size:clamp(32px,5vw,48px);margin-bottom:12px}
.hero h1 em{color:var(--pink-dark);font-style:normal}
.hero p{font-size:18px;color:#555;max-width:620px;margin:0 auto 24px}
.btn{background:var(--pink-dark);color:white;padding:14px 28px;border:none;border-radius:12px;font-weight:600;cursor:pointer;text-decoration:none;display:inline-block;transition:.2s}
.btn:hover{transform:translateY(-1px);box-shadow:0 6px 16px rgba(232,155,173,.4)}
.container{max-width:1200px;margin:0 auto;padding:0 24px 60px}
.filters{display:flex;gap:10px;flex-wrap:wrap;margin:32px 0;justify-content:center}
.filter{padding:9px 18px;border:1px solid #f0d6dd;background:white;border-radius:24px;cursor:pointer;font-size:14px;font-weight:500;transition:.2s}
.filter.active{background:var(--pink-dark);color:white;border-color:var(--pink-dark);transform:scale(1.05)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:24px;margin-top:20px}
.card{background:white;border-radius:18px;overflow:hidden;box-shadow:0 2px 12px rgba(0,0,0,.06);transition:.25s;border:1px solid #f9eef2}
.card:hover{transform:translateY(-5px);box-shadow:0 12px 24px rgba(247,198,208,.3)}
.card-img-wrap{width:100%;height:260px;background:var(--pink-light);position:relative;overflow:hidden;display:flex;align-items:center;justify-content:center}
.card-img{width:100%;height:100%;object-fit:cover;display:block}
.card-img-fallback{font-family:"Playfair Display",serif;font-size:48px;color:var(--pink-dark);font-weight:600;opacity:0.8}
.card-body{padding:18px}
.card-cat{font-size:11px;color:var(--pink-dark);text-transform:uppercase;letter-spacing:.6px;font-weight:800}
.card-name{font-size:17px;margin:6px 0 4px;font-weight:600;line-height:1.3}
.card-desc{font-size:13px;color:#777;height:36px;overflow:hidden}
.card-foot{display:flex;justify-content:space-between;align-items:center;margin-top:14px}
.price{font-weight:700;font-size:18px}
.add{background:var(--charcoal);color:white;border:none;padding:9px 16px;border-radius:9px;cursor:pointer;font-size:13px;font-weight:600}
.cart-drawer{position:fixed;top:0;right:-420px;width:400px;max-width:95vw;height:100vh;background:white;box-shadow:-8px 0 30px rgba(0,0,0,.12);z-index:100;transition:right .35s;display:flex;flex-direction:column}
.cart-drawer.open{right:0}
.cart-head{padding:20px 24px;border-bottom:1px solid #f0e6e9;display:flex;justify-content:space-between;align-items:center;font-weight:600}
.cart-items{flex:1;overflow:auto;padding:12px 24px}
.cart-item{display:flex;gap:14px;padding:14px 0;border-bottom:1px solid #f9f0f3}
.cart-item img{width:64px;height:64px;object-fit:cover;border-radius:10px;background:var(--pink-light)}
.qty{display:flex;align-items:center;gap:10px;margin-top:8px}
.qty button{width:26px;height:26px;border:1px solid #ddd;background:white;border-radius:6px;cursor:pointer;font-weight:700}
.cart-foot{padding:20px 24px;border-top:1px solid #f0e6e9;background:var(--pink-light)}
.row{display:flex;justify-content:space-between;margin:7px 0;font-size:14px}
.row.total{font-weight:700;font-size:17px;margin-top:12px;border-top:1px dashed #e0c0c8;padding-top:12px}
.checkout-btn{width:100%;margin-top:14px;background:var(--pink-dark);font-size:15px;padding:14px}
.whatsapp-btn{width:100%;margin-top:10px;background:white;color:var(--charcoal);border:1px solid #e8c9d1;font-size:14px}
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:99;display:none}
.overlay.show{display:block}
.empty{text-align:center;padding:50px 20px;color:#999}
footer{text-align:center;padding:32px;color:#888;font-size:13px;background:white;border-top:1px solid #f9eef2}
</style>
</head>
<body>
<header><div class="nav"><div class="logo">Sugar<span>&</span>Sage <span class="badge">pastel pink</span></div><div class="cart" onclick="toggleCart()">🛍️<span class="cart-count" id="cartCount">0</span></div></div></header>
<section class="hero"><h1>Handcrafted Beauty in <em>Pastel Pink</em></h1><p>Small-batch skincare, body care and fragrance made in Cape Town with fynbos, rooibos and love.</p><a href="#products" class="btn">Shop the Collection</a></section>
<div class="container" id="products"><div class="filters" id="filters"></div><div class="grid" id="grid"></div></div>
<div class="cart-drawer" id="drawer"><div class="cart-head"><span>Your Cart</span><span style="cursor:pointer;font-size:20px" onclick="toggleCart()">✕</span></div><div class="cart-items" id="cartItems"></div><div class="cart-foot"><div class="row"><span>Subtotal</span><span id="subtotal">R0</span></div><div class="row"><span>Delivery</span><select id="delivery" onchange="updateTotals()" style="border:1px solid #ddd;border-radius:6px;padding:4px 8px"><option value="60">Paxi R60</option><option value="100">Courier R100</option><option value="0">Collect - Free</option></select></div><div class="row total"><span>Total</span><span id="total">R0</span></div><button class="btn checkout-btn" onclick="checkoutYoco()">Pay with Yoco 💳</button><button class="btn whatsapp-btn" onclick="checkoutWhatsApp()">Order via WhatsApp</button><div style="text-align:center;margin-top:12px;font-size:11px;color:#999">Secure by Yoco • <a href="#" onclick="setupYocoPage();return false" style="color:#999">Setup</a></div></div></div>
<div class="overlay" id="overlay" onclick="toggleCart()"></div>
<footer>© 2026 Sugar & Sage — Handcrafted in Cape Town 🌸</footer>
<script>
// FIXED: Products are now hardcoded so they look the same in EVERY browser.
// No more localStorage product list that causes Edge vs Chrome differences.
const products = [
  {id:'p004',name:'Sugarandsage #004 Velvet Plum',category:'Fragrance',price:149,stock:50,image:'https://images.unsplash.com/photo-1594035910387-fea47794261f?w=600&h=600&fit=crop&auto=format',description:'Velvet plum and dark berries - 50ml', fallback:'Velvet Plum'},
  {id:'p002',name:'Sugarandsage #002 Coconut Blossom',category:'Fragrance',price:149,stock:50,image:'https://images.unsplash.com/photo-1541643600914-78b084683601?w=600&h=600&fit=crop&auto=format',description:'Coconut blossom and vanilla - 50ml', fallback:'Coconut'},
  {id:'p006',name:'Sugarandsage #006 Vanilla Sun',category:'Fragrance',price:149,stock:50,image:'https://images.unsplash.com/photo-1593487568720-3eab4c81be82?w=600&h=600&fit=crop&auto=format',description:'Warm vanilla and citrus - 50ml', fallback:'Vanilla'},
  {id:'p005',name:'Sugarandsage #005 Sugared Velvit',category:'Fragrance',price:149,stock:50,image:'https://images.unsplash.com/photo-1615529151169-7b1ff50dc7f2?w=600&h=600&fit=crop&auto=format',description:'Velvet plum and sugared violet - 50ml', fallback:'Sugared'},
  {id:'p001',name:'Sugarandsage #001 Wild Fig',category:'Fragrance',price:149,stock:50,image:'https://images.unsplash.com/photo-1543422655-ac1c6ca99310?w=600&h=600&fit=crop&auto=format',description:'Wild fig and sandalwood - 50ml', fallback:'Wild Fig'},
  {id:'p003',name:'Sugarandsage #003 Fynbos Dawn',category:'Fragrance',price:149,stock:50,image:'https://images.unsplash.com/photo-1523293182086-7651a899d37f?w=600&h=600&fit=crop&auto=format',description:'Fynbos and morning dew - 50ml', fallback:'Fynbos'},
  {id:'p007',name:'Rooibos Glow Face Mask',category:'Skincare',price:185,stock:30,image:'https://images.unsplash.com/photo-1556228578-0d85b1a4d571?w=600&h=600&fit=crop&auto=format',description:'Antioxidant rooibos clay mask with honeybush and kaolin', fallback:'Mask'},
  {id:'p008',name:'Vanilla Bean Sugar Scrub',category:'Body Care',price:245,stock:20,image:'https://images.unsplash.com/photo-1600857544200-b2f666a9a2ec?w=600&h=600&fit=crop&auto=format',description:'Exfoliating raw sugar with Madagascar vanilla and shea', fallback:'Vanilla'},
  {id:'p009',name:'Sage & Sea Salt Candle',category:'Bath & Body',price:195,stock:25,image:'https://images.unsplash.com/photo-1602874801027-dee26ffa1d31?w=600&h=600&fit=crop&auto=format',description:'Hand-poured soy wax with wild sage and Atlantic sea salt', fallback:'Sage'},
  {id:'p010',name:'Wild Honey & Oat Soap',category:'Bath & Body',price:85,stock:40,image:'https://images.unsplash.com/photo-1600857544200-b2f666a9a2ec?w=600&h=600&fit=crop&auto=format',description:'Cold-processed with fynbos honey and colloidal oats', fallback:'Honey'}
];

let cart=JSON.parse(localStorage.getItem('ss_cart')||'[]');
let activeCat='All';
const categories=['All','Skincare','Body Care','Hair Care','Bath & Body','Fragrance','Makeup','Wellness','Gift Sets'];

function renderFilters(){document.getElementById('filters').innerHTML=categories.map(c=>`<button class="filter ${c===activeCat?'active':''}" onclick="setCat('${c}')">${c}</button>`).join('');}
function setCat(c){activeCat=c;renderFilters();renderGrid();}

function renderGrid(){
  const list=activeCat==='All'?products:products.filter(p=>p.category===activeCat);
  document.getElementById('grid').innerHTML=list.map(p=>`
    <div class="card">
      <div class="card-img-wrap">
        <img src="${p.image}" class="card-img" alt="${p.name}" loading="lazy" referrerpolicy="no-referrer"
             onerror="this.style.display='none'; this.nextElementSibling.style.display='flex'">
        <div class="card-img-fallback" style="display:none; width:100%; height:100%; align-items:center; justify-content:center; background:#FDEBF1;">${p.fallback}</div>
      </div>
      <div class="card-body">
        <div class="card-cat">${p.category}</div>
        <div class="card-name">${p.name}</div>
        <div class="card-desc">${p.description}</div>
        <div class="card-foot"><div class="price">R${p.price}</div><button class="add" onclick="addToCart('${p.id}')">Add</button></div>
      </div>
    </div>`).join('')||'<div style="grid-column:1/-1;text-align:center;padding:40px;color:#999">No products</div>';
}

function saveCart(){localStorage.setItem('ss_cart',JSON.stringify(cart));document.getElementById('cartCount').textContent=cart.reduce((s,i)=>s+i.qty,0);}
function addToCart(id){const p=products.find(x=>x.id===id);const ex=cart.find(x=>x.id===id);if(ex)ex.qty++;else cart.push({id:p.id,name:p.name,price:p.price,image:p.image,qty:1});saveCart();renderCart();toggleCart(true);}
function updateQty(id,d){const it=cart.find(x=>x.id===id);if(!it)return;it.qty+=d;if(it.qty<1)cart=cart.filter(x=>x.id!==id);saveCart();renderCart();}
function renderCart(){const el=document.getElementById('cartItems');if(cart.length===0){el.innerHTML='<div class="empty">Your cart is empty<br><br><a href="#products" onclick="toggleCart()" class="btn">Shop now</a></div>';}else{el.innerHTML=cart.map(i=>`<div class="cart-item"><img src="${i.image}" referrerpolicy="no-referrer"><div style="flex:1"><div style="font-weight:600;font-size:14px">${i.name}</div><div style="font-size:13px;color:#666">R${i.price} x ${i.qty}</div><div class="qty"><button onclick="updateQty('${i.id}',-1)">-</button><span>${i.qty}</span><button onclick="updateQty('${i.id}',1)">+</button></div></div></div>`).join('');}updateTotals();}
function updateTotals(){const sub=cart.reduce((s,i)=>s+i.price*i.qty,0);const del=parseInt(document.getElementById('delivery').value||0);document.getElementById('subtotal').textContent='R'+sub;document.getElementById('total').textContent='R'+(sub+del);}
function toggleCart(force){const d=document.getElementById('drawer'),o=document.getElementById('overlay');const isOpen=d.classList.contains('open');if(force===true||!isOpen){d.classList.add('open');o.classList.add('show');renderCart();}else{d.classList.remove('open');o.classList.remove('show');}}

async function checkoutYoco(){
  if(cart.length===0) return alert('Cart empty');
  const HARDCODED_YOCO = 'https://pay.yoco.com/Sugarandsage';
  const total=cart.reduce((s,i)=>s+i.price*i.qty,0)+parseInt(document.getElementById('delivery').value||0);
  const deliveryText=document.getElementById('delivery').selectedOptions[0].text;
  const ref='SS-'+Date.now().toString().slice(-8);
  const cust=document.getElementById('custName').value||''; const email=document.getElementById('custEmail').value||'';
  // ALWAYS use hardcoded, ignore localStorage WhatsApp fallback
  const yocoUrl = HARDCODED_YOCO + `?amount=${total*100}&reference=${ref}`;
  window.open(yocoUrl, '_blank');
  // Also try Netlify function for reference
  try{await fetch('/.netlify/functions/yoco-checkout',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({amount:total,reference:ref,email,customerName:cust})});}catch(e){}
  alert(`Order ${ref} - Complete payment in Yoco tab!
Total: R${total}
Delivery: ${deliveryText}`);
}

function setupYocoPage(){const cur=localStorage.getItem('yoco_payment_page')||'';const url=prompt('Yoco Payment Page link:',cur);if(url!==null){localStorage.setItem('yoco_payment_page',url);alert('Saved: '+url);}}
function checkoutWhatsApp(){if(cart.length===0)return alert('Cart empty');const total=cart.reduce((s,i)=>s+i.price*i.qty,0)+parseInt(document.getElementById('delivery').value||0);const lines=cart.map(i=>`• ${i.qty}x ${i.name} - R${i.price*i.qty}`).join('%0A');const del=document.getElementById('delivery').selectedOptions[0].text;const msg=`Hi Sugar & Sage! I'd like to order:%0A${lines}%0A%0ADelivery: ${del}%0ATotal: R${total}`;/* disabled wa */ window.open(`https://wa.me/27700000000?text=${msg}`,'_blank');}

renderFilters();renderGrid();saveCart();
// Clear old buggy localStorage products that caused Edge vs Chrome difference
localStorage.removeItem('ss_products');
</script>
</body>
</html>
